name: Numerical development reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.7'
          cache: pip
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the unchanged numerical core as an isolated LTO library
        run: |
          cmake -S evidence/consumer-build -B build/consumer-build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/consumer-build --verbose
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('build/consumer-build/compile_commands.json').read_text())
          assert len(rows) == 2
          for row in rows:
              flags = row['command'].split()
              assert flags.index('-O3') < flags.index('-O2')
              for common, override in [('-Wfloat-equal', '-Wno-float-equal'),
                                       ('-fno-signed-zeros', '-fsigned-zeros'),
                                       ('-freciprocal-math', '-fno-reciprocal-math')]:
                  assert flags.index(common) < flags.index(override)
              assert all(x in flags for x in ('-std=c99', '-O2', '-Werror',
                                             '-fno-fast-math', '-ffp-contract=off'))
              assert any(x.startswith('-flto') for x in flags)
              assert Path(row['output']).is_file()
          assert Path('build/consumer-build/libcontrol_core.a').is_file()
          PY
      - name: Reproduce registered active-variant ceiling counterexample
        run: |
          cp active/results.json "$RUNNER_TEMP/active-results-baseline.json"
          python active/generate.py
          git diff --exit-code -- active/generated
          python active/qualify.py
          python active/check_counterexample.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          baseline = json.loads((Path(os.environ['RUNNER_TEMP']) / 'active-results-baseline.json').read_text())
          observed = json.loads(Path('active/results.json').read_text())
          assert observed['cases'] == baseline['cases']
          assert observed['continuous_ceiling_holds'] is False
          assert observed['universal_ceiling_refuted'] is True
          PY
          cmake -S active -B build/active-cmake -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/active-cmake --verbose
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('build/active-cmake/compile_commands.json').read_text())
          assert len(rows) == 1
          flags = rows[0]['command'].split()
          assert flags.index('-O3') < flags.index('-O2')
          for common, override in [('-Wfloat-equal', '-Wno-float-equal'),
                                   ('-fno-signed-zeros', '-fsigned-zeros'),
                                   ('-freciprocal-math', '-fno-reciprocal-math')]:
              assert flags.index(common) < flags.index(override)
          assert all(x in flags for x in ('-std=c99', '-Werror', '-fno-fast-math', '-ffp-contract=off'))
          assert any(x.startswith('-flto') for x in flags)
          assert Path(rows[0]['output']).is_file()
          assert Path('build/active-cmake/libactive_symmetric_core.a').is_file()
          PY
      - name: Reproduce separate PX4 timestamp-domain development failure
        run: |
          cp active/px4_domain/results.json "$RUNNER_TEMP/px4-domain-baseline.json"
          python active/px4_domain/run.py
          python active/px4_domain/check_closed_form.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = json.loads((Path(os.environ['RUNNER_TEMP']) / 'px4-domain-baseline.json').read_text())
          actual = json.loads(Path('active/px4_domain/results.json').read_text())
          assert actual['dt_bits'] == expected['dt_bits']
          assert actual['cases'] == expected['cases']
          assert actual['controls'] == expected['controls']
          assert actual['stopped_on_first_failure'] is True
          PY
      - name: Characterize the known signed-zero discrepancy and check host arithmetic
        run: |
          mkdir -p build/ci-evidence
          cc -std=c99 -O2 -fno-fast-math -ffp-contract=off -Wall -Wextra -Wno-unused-parameter -Werror campaign/arithmetic_controls.c -o build/arithmetic-controls
          build/arithmetic-controls > build/ci-evidence/arithmetic-controls.json
          cc -std=c99 -O2 -fno-fast-math -ffp-contract=off -Wall -Wextra -Wno-unused-parameter -Werror campaign/replay_zero_hold.c generated/zero_reset.c generated/tracking_reset.c -o build/zero-hold-replay
          build/zero-hold-replay > build/ci-evidence/zero-hold-replay.json
      - name: Reproduce the supplemental observational pilot
        run: |
          python campaign/generate_cases.py pilot 2 "$RUNNER_TEMP/observation-inputs.jsonl"
          python campaign/observe.py "$RUNNER_TEMP/observation-inputs.jsonl" build/observation
          python campaign/audit_observation.py "$RUNNER_TEMP/observation-inputs.jsonl" build/observation/rows.jsonl.gz > build/ci-evidence/observation-audit.json
          cp build/observation/summary.json build/ci-evidence/observation-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('evidence/observational/pilot-summary.json').read_text())
          observed = json.loads(Path('build/observation/summary.json').read_text())
          run_fields = {'builds', 'elapsed_s', 'peak_rss_bytes', 'sha256', 'artifact_bytes'}
          assert {k: v for k, v in baseline.items() if k not in run_fields} == {
              k: v for k, v in observed.items() if k not in run_fields
          }
          PY
          python campaign/cross_inputs.py > "$RUNNER_TEMP/cross-inputs.txt"
          cc -std=c99 -O2 -fno-fast-math -ffp-contract=off -Wall -Wextra -Wno-unused-parameter -Werror campaign/cross_runner.c generated/zero_reset.c generated/tracking_reset.c -o build/cross-runner
          build/cross-runner < "$RUNNER_TEMP/cross-inputs.txt" > build/ci-evidence/cross-native.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = json.loads(Path('evidence/observational/cross-summary.json').read_text())
          assert hashlib.sha256(Path('build/ci-evidence/cross-native.txt').read_bytes()).hexdigest() == expected['output_sha256']
          PY
      - name: Replay and explain the retained branch issues
        run: |
          python review_branch_use.py
          git diff --exit-code -- evidence/branch-use.json evidence/branch-use-table.md
          mkdir -p build/ci-evidence
          cp build/branch-use/run.json build/ci-evidence/branch-use-run.json
      - name: Replay reviewed counterexamples
        run: |
          python campaign/review_cases.py > build/ci-evidence/review-cases.json
      - name: Regenerate, compile and compare the frozen development corpus
        run: |
          cp evidence/results.json "$RUNNER_TEMP/baseline.json"
          python generate.py
          git diff --exit-code -- generated
          python qualify.py
          mkdir -p build/ci-evidence
          cp evidence/results.json evidence/traces.csv build/ci-evidence/
          git diff --exit-code -- evidence/traces.csv
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          baseline = json.loads((Path(os.environ['RUNNER_TEMP']) / 'baseline.json').read_text())
          observed = json.loads(Path('evidence/results.json').read_text())
          # Toolchain identity, compiled bytes and elapsed time describe this run.
          # Everything scientific, including source hashes and branch issues, must match.
          environment_fields = {'environment', 'builds', 'elapsed_generation_excluded_s'}
          assert {k: v for k, v in observed.items() if k not in environment_fields} == {
              k: v for k, v in baseline.items() if k not in environment_fields
          }, 'development result changed'
          assert all(b['float_arithmetic_ops'] > 0 for b in observed['builds'].values()), 'missing float IR'
          print('Recorded numerical result, trace CSV and generated C reproduced; integration remains unqualified.')
          PY
      - name: Retain this run's numerical evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-evidence
          path: build/ci-evidence/
          if-no-files-found: warn
